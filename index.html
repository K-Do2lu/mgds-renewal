<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mg-prj</title>
    <style>
      #app > .app-boot {
        box-sizing: border-box;
        min-height: 100dvh;
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f6ff;
      }
      .app-boot__dots {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 12px;
        height: 36px;
      }
      .app-boot__dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        transform-origin: center bottom;
        box-shadow:
          0 4px 10px rgba(29, 78, 216, 0.2),
          inset 0 1px 1px rgba(255, 255, 255, 0.75);
        animation: app-boot-boing 0.75s ease-in-out infinite;
      }
      .app-boot__dot:nth-child(1) {
        background: radial-gradient(circle at 30% 22%, #ffffff 0%, #bfdbfe 42%, #1d4ed8 100%);
        animation-delay: 0s;
      }
      .app-boot__dot:nth-child(2) {
        width: 15px;
        height: 15px;
        background: radial-gradient(circle at 30% 22%, #ffffff 0%, #c7d2fe 38%, #6366f1 100%);
        animation-delay: 0.1s;
      }
      .app-boot__dot:nth-child(3) {
        background: radial-gradient(circle at 30% 22%, #ffffff 0%, #a5b4fc 40%, #4f46e5 95%);
        animation-delay: 0.2s;
      }
      .app-boot__ground {
        width: 56px;
        height: 8px;
        margin: 2px auto 0;
        border-radius: 50%;
        background: radial-gradient(ellipse 100% 100% at 50% 50%, rgba(29, 78, 216, 0.14) 0%, transparent 72%);
        opacity: 0.85;
      }
      @keyframes app-boot-boing {
        0%,
        100% {
          transform: translateY(0) scale(1, 1);
        }
        18% {
          transform: translateY(0) scale(1.14, 0.82);
        }
        48% {
          transform: translateY(-18px) scale(0.94, 1.08);
        }
        62% {
          transform: translateY(0) scale(1.1, 0.88);
        }
        76% {
          transform: translateY(-6px) scale(1, 1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot__dot {
          animation: app-boot-soft 1.25s ease-in-out infinite;
        }
        .app-boot__dot:nth-child(1) {
          animation-delay: 0s;
        }
        .app-boot__dot:nth-child(2) {
          animation-delay: 0.15s;
        }
        .app-boot__dot:nth-child(3) {
          animation-delay: 0.3s;
        }
        @keyframes app-boot-soft {
          0%,
          100% {
            opacity: 0.45;
            transform: translateY(0) scale(1);
          }
          50% {
            opacity: 1;
            transform: translateY(0) scale(1.06);
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot" role="status" aria-live="polite" aria-label="로딩 중">
        <div aria-hidden="true">
          <div class="app-boot__dots">
            <div class="app-boot__dot"></div>
            <div class="app-boot__dot"></div>
            <div class="app-boot__dot"></div>
          </div>
          <div class="app-boot__ground"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
